[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aadtcs-cfl-recovery"
version = "0.2.0"
description = "Shadow-only scientific intake and evidence qualification primitives for AAD-TCS"
requires-python = ">=3.11"
authors = [{name = "Facundo Firmenich"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
