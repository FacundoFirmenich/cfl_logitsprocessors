name: Laya RDSS headroom v0.1

on:
  push:
    branches:
      - exp/laya-rdss-headroom-v0.1
    paths:
      - "experiments/laya_rdss_headroom_v0_1/**"
      - ".github/workflows/laya-rdss-headroom-v0.1.yml"
  pull_request:
    branches:
      - "Ulalito's-Island"
    paths:
      - "experiments/laya_rdss_headroom_v0_1/**"
      - ".github/workflows/laya-rdss-headroom-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensor-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache public Laya checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-typed-decisions-v0.3.9-${{ runner.os }}

      - name: Install frozen experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/laya_rdss_headroom_v0_1/requirements.txt

      - name: Reconstruct provenance-bound real dataset
        run: |
          base64 -d experiments/laya_rdss_headroom_v0_1/data/qwen35_seed14_exante.jsonl.gz.b64 | gzip -dc > /tmp/qwen35_seed14_exante.jsonl
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('/tmp/qwen35_seed14_exante.jsonl')
          manifest=json.loads(Path('experiments/laya_rdss_headroom_v0_1/data/DATASET_MANIFEST.json').read_text())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got == manifest['derived_jsonl_sha256'], (got, manifest['derived_jsonl_sha256'])
          print({'dataset_sha256':got,'bytes':p.stat().st_size})
          PY

      - name: Execute open-weight System-One sensor replay
        run: |
          rm -rf experiments/laya_rdss_headroom_v0_1/results
          python experiments/laya_rdss_headroom_v0_1/run_experiment.py \
            --data /tmp/qwen35_seed14_exante.jsonl \
            --out experiments/laya_rdss_headroom_v0_1/results \
            --batch-size 3

      - name: Hash evidence bundle
        run: |
          cd experiments/laya_rdss_headroom_v0_1
          find data results -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload immutable replay outputs
        uses: actions/upload-artifact@v4
        with:
          name: laya-rdss-headroom-v0.1
          path: |
            experiments/laya_rdss_headroom_v0_1/results/
            experiments/laya_rdss_headroom_v0_1/SHA256SUMS.txt
            experiments/laya_rdss_headroom_v0_1/data/DATASET_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
