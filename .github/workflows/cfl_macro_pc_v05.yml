name: CFL External Gold-Isolated Benchmark v1.3

on:
  pull_request:
    branches:
      - "Ulalito's-Island"
    paths:
      - "experiments/macro_pc_v05/**"
      - ".github/workflows/cfl_macro_pc_v05.yml"

permissions:
  contents: read

jobs:
  external-benchmark-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install benchmark runtime
        run: |
          pip install transformers==4.57.1 safetensors==0.6.2 numpy==2.4.6 datasets==4.2.0

      - name: Show frozen preregistration
        run: |
          sha256sum experiments/macro_pc_v05/PREREG_EXTERNAL_BENCHMARK_v1.3.json
          cat experiments/macro_pc_v05/PREREG_EXTERNAL_BENCHMARK_v1.3.json

      - name: Execute external benchmark
        run: |
          python experiments/macro_pc_v05/run_external_benchmark_v13.py | tee external_v13_summary.json

      - name: Show result
        if: always()
        run: |
          cat external_v13_summary.json || true
          if [ -f external_v13_artifact/manifest.json ]; then
            echo "=== MANIFEST ==="
            cat external_v13_artifact/manifest.json
          fi

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfl-external-benchmark-v13-artifact
          path: |
            external_v13_artifact/
            external_v13_summary.json
            experiments/macro_pc_v05/PREREG_EXTERNAL_BENCHMARK_v1.3.json
          if-no-files-found: error
          retention-days: 30
