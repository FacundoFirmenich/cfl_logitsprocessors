name: CFL P Internal Anti-Regression Adjudicator v0.9

on:
  pull_request:
    branches:
      - "Ulalito's-Island"
    paths:
      - "experiments/macro_pc_v05/**"
      - ".github/workflows/cfl_macro_pc_v05.yml"

permissions:
  contents: read

jobs:
  p-internal-adjudicator-v09:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install Transformers
        run: |
          pip install transformers==4.57.1 safetensors==0.6.2

      - name: Execute P-internal adjudicator gate
        run: |
          python experiments/macro_pc_v05/run_p_internal_adjudicator_gate_v09.py | tee p_internal_v09_summary.json

      - name: Show result
        if: always()
        run: |
          cat p_internal_v09_summary.json || true
          if [ -f macro_pc_v09_artifact/manifest.json ]; then
            echo "=== MANIFEST ==="
            cat macro_pc_v09_artifact/manifest.json
          fi

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfl-p-internal-adjudicator-v09-artifact
          path: |
            macro_pc_v09_artifact/
            p_internal_v09_summary.json
          if-no-files-found: error
          retention-days: 30
