name: CFL Macro P-C Gate v0.5.2

on:
  pull_request:
    branches:
      - "Ulalito's-Island"
    paths:
      - "experiments/macro_pc_v05/**"
      - ".github/workflows/cfl_macro_pc_v05.yml"

permissions:
  contents: read

jobs:
  macro-pc-v052:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install Transformers
        run: |
          pip install transformers==4.57.1 safetensors==0.6.2

      - name: Execute admissible p01 macro P-C gate
        run: |
          python experiments/macro_pc_v05/run_macro_pc_gate_v052.py \
            --output-dir macro_pc_v052_artifact | tee macro_pc_v052_summary.json

      - name: Show frozen candidates, outcome, successor and manifest
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("macro_pc_v052_artifact")
          if (root / "candidates.json").exists():
              c = json.loads((root / "candidates.json").read_text())
              print("=== L1 ===")
              print(c["P"]["L1"]["text"])
              print("=== L2 ===")
              print(c["P"]["L2"]["text"])
              print("=== L3 RAW RESPONSE ===")
              print(c["P"]["L3"]["text"])
              print("=== P FINAL / INFORMED ===")
              print(c["P"]["final_text"])
              print("=== C FINAL ===")
              print(c["C"]["final_text"])
          for fn, label in [
              ("decision_frozen.json","DECISION"),
              ("outcome_exact.json","OUTCOME"),
              ("successor_model_v1.json","SUCCESSOR"),
              ("manifest.json","MANIFEST"),
          ]:
              p = root / fn
              if p.exists():
                  print(f"=== {label} ===")
                  print(p.read_text())
          PY

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfl-macro-pc-v052-artifact
          path: |
            macro_pc_v052_artifact/
            macro_pc_v052_summary.json
          if-no-files-found: error
          retention-days: 30
