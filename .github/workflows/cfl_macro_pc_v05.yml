name: CFL Macro P-C Multicase Gate v0.6

on:
  pull_request:
    branches:
      - "Ulalito's-Island"
    paths:
      - "experiments/macro_pc_v05/**"
      - ".github/workflows/cfl_macro_pc_v05.yml"

permissions:
  contents: read

jobs:
  macro-pc-v06:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install Transformers
        run: |
          pip install transformers==4.57.1 safetensors==0.6.2

      - name: Execute real multicase macro P-C gate
        run: |
          python experiments/macro_pc_v05/run_macro_pc_gate_v06.py | tee macro_pc_v06_summary.json

      - name: Show summary and frozen outcomes
        if: always()
        run: |
          cat macro_pc_v06_summary.json || true
          python - <<'PY'
          from pathlib import Path
          root = Path("macro_pc_v06_artifact")
          for pid in ["p01","p03","p04"]:
              for suffix in ["candidates","decision_frozen","outcome"]:
                  p = root / f"{pid}_{suffix}.json"
                  if p.exists():
                      print(f"=== {p.name} ===")
                      print(p.read_text())
          for fn in ["successor_local_multicase_v1.json","z_post_multicase.json","manifest.json"]:
              p=root/fn
              if p.exists():
                  print(f"=== {fn} ===")
                  print(p.read_text())
          PY

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfl-macro-pc-v06-artifact
          path: |
            macro_pc_v06_artifact/
            macro_pc_v06_summary.json
          if-no-files-found: error
          retention-days: 30
